        streamBubble = null;
        streamTextEl = null;
        streamText = '';
        clearWorkflow();
        resetDiscussUI();
        uploadedFiles = [];
        renderFilePreview();
        setStatus(false);
        addMessage('agent', WELCOME_TEXT);
    }

    async function loadStatus() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('modelBadge').textContent = '🧠 ' + data.model;
            document.getElementById('toolBadge').textContent = '🔧 ' + data.tool_count + ' APIs';
        } catch(e) {
            document.getElementById('modelBadge').textContent = '🧠 离线';
        }
    }

    async function loadModels() {
        try {
            const res = await fetch('/api/models');
            const data = await res.json();
            const sel = document.getElementById('modelSelector');
            sel.innerHTML = '<option value="">切换模型...</option>';
            data.models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.key;
                opt.textContent = m.name + (m.vision ? ' 👁' : '');

                sel.appendChild(opt);

    async function switchModel(key) {
        if (!key) return;
        // 任务运行中切模型会让新旧两个任务同时占用引擎/台账,先拦下来
        if (currentEventSource) {
            alert('请先停止当前任务，再切换模型');
            loadModels();
            return;

        if (!confirm('切换模型将清空当前对话，确定吗？')) {
            loadModels();

        try {
            const res = await fetch('/api/switch-model', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({model: key})

            const data = await res.json();
            if (data.status === 'ok') {
                resetChatUI();
                loadStatus();

    // ====== 角色预设(persona) ======
    async function loadPersonas() {

            const data = await res.json();
            const sel = document.getElementById('personaSelector');
            sel.innerHTML = '<option value="">角色...</option>';
            data.personas.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.key;
                opt.textContent = p.name;
                if (p.key === data.active) opt.selected = true;
                sel.appendChild(opt);

    async function setPersona(key) {
        if (!key) return;

            alert('请先停止当前任务，再切换角色');

    // 页面加载时初始化
    loadModels();

    // ====== 桌宠：小寒影的分身 ======

    const PET_IDLE_ACTS = [
        ['act-twitch', 650], ['act-twitch2', 650], ['act-hop', 640],
        ['act-stretch', 900], ['act-sway', 1500]
    ];

    let petEl = null, petBubbleEl = null;
    let petState = 'idle';
    let petBubbleTimer = null, petIdleTimer = null, petClickTimer = null, petFlashTimer = null;
    let petClicks = 0, petPresetIdx = 0, petDragging = false;

    function petRefs() {
        if (!petEl) petEl = document.getElementById('pet');
        if (!petBubbleEl) petBubbleEl = document.getElementById('petBubble');
        return !!(petEl && petBubbleEl);
    }
    function petPick(a) { return a[Math.floor(Math.random() * a.length)]; }

    // ---- 气泡 ----
    function petBubbleSide() {
        if (!petRefs()) return;
        const panel = petEl.offsetParent;
        if (!panel) return;
        // 靠面板左侧时气泡翻到右边，反之默认挂左边
        petBubbleEl.classList.toggle('flip', petEl.offsetLeft < (panel.clientWidth || 1) * 0.34);
    }
    function petShow(text, ms) {
        if (!petRefs() || !text) return;
        petBubbleEl.textContent = text;
        petBubbleSide();
        petBubbleEl.classList.add('show');
        clearTimeout(petBubbleTimer);
        petBubbleTimer = setTimeout(function () { petBubbleEl.classList.remove('show'); }, ms || 2400);
    }

    // ---- 小动作 / 警示 ----
    function petFlash(cls, ms) {
        if (!petRefs()) return;
        petEl.classList.add(cls);
        clearTimeout(petFlashTimer);
        petFlashTimer = setTimeout(function () { petEl.classList.remove(cls); }, ms);
    }
    function petBlink() { petFlash('blink', 150); }
    function petAlert(on) { if (petRefs()) petEl.classList.toggle('alert', !!on); }

    // ---- 状态机：idle / think / work / talk ----
    function petSetState(s) {
        if (!petRefs() || petState === s) return;
        petState = s;
        petEl.dataset.state = s;
    }

    // 收尾：先闪一下开心/难过，再回空闲
    function petFinish(isError) {
        petAlert(false);
        petSetState('idle');
        if (isError) {
            petFlash('act-shake', 600);
            petShow(petPick(PET_LINES.err), 2600);
        } else {
            petFlash('pet--happy', 1300);
            petShow(petPick(PET_LINES.done), 2200);
        }
    }

    // ---- 事件消费者：把已有事件翻译成表情 ----
    // kind: 'chat' = /api/chat 的 Agent 事件；'discuss' = /api/discuss 的讨论事件
    function petFeed(kind, raw) {
        let d;
        try { d = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return; }
        if (!d || !d.type) return;
        const t = d.type;

        if (kind === 'discuss') {
            // 讨论：全程「思考」，暂停时歇一下，出结论就庆祝
            if (t === 'paused') {
                petSetState('idle');
                petShow('暂停啦，主人想说什么？', 2600);
            } else if (t === 'complete') {
                petFinish(false);
            } else if (t === 'error') {
                petFinish(true);
            } else {
                petSetState('think');
                if (t === 'round') petShow(d.label || '新一轮…', 1800);
                else if (t === 'speaker_start') petShow((d.avatar || '') + (d.speaker_name || '') + ' 在想…', 1800);
                else if (t === 'user_said') petShow('主人插话啦，它们在听', 2000);
            }
            return;
        }

        petAlert(t === 'approval_request');   // 只有「等批准」这一刻才挂警示
        switch (t) {
            case 'start':
            case 'thinking':
                petSetState('think');
                if (Math.random() < 0.35) petShow(petPick(PET_LINES.think), 1600);
                break;
            case 'text_delta':
                petSetState('talk');
                break;
            case 'notice':
                petSetState('think');
                break;
            case 'tool_call':
                petSetState('work');
                petShow('🔧 ' + (PET_TOOL_LABEL[d.name] || d.name || '干活') + '…', 2200);
                break;
            case 'tool_result':
                petSetState('work');
                break;
            case 'approval_request':
                petSetState('work');
                petShow(petPick(PET_LINES.wait), 6000);
                break;
            case 'complete':
                petFinish(false);
                break;
            case 'error':
                petFinish(true);
                break;
        }
    }

    // ---- 点击 / 双击互动 ----
    function petOnClick() {
        if (!petRefs()) return;
        petClicks++;
        petFlash('act-hop', 640);
        petShow(petClicks >= 5 && petClicks % 3 === 0 ? petPick(PET_LINES.many) : petPick(PET_LINES.click), 2000);
    }
    // 双击：把一条「对得上真实工具」的提示词填进输入框，可改可删，不自动发送
    function petOnDblClick() {
        if (!petRefs()) return;
        const box = document.getElementById('chatInput');
        if (!box) return;
        if (box.disabled) { petShow('主人，小寒影还在忙呢…等会儿再点我喵~', 2600); return; }
        const preset = PET_PRESETS[petPresetIdx % PET_PRESETS.length];
        petPresetIdx++;
        if (box.value.trim()) {
            if (box.value.indexOf(preset) === -1) box.value = box.value.trim() + ' ' + preset;
        } else {
            box.value = preset;
        }
        box.focus();
        try { box.setSelectionRange(box.value.length, box.value.length); } catch (e) {}
        petFlash('pet--happy', 900);
        petShow('喵~ 填好啦，改完再点发送哦！', 2600);
    }

    // ---- 拖动 + 位置记忆 ----
    function petClamp() {
        if (!petRefs()) return;
        const panel = petEl.offsetParent;
        if (!panel) return;
        const w = petEl.offsetWidth, h = petEl.offsetHeight;
        const maxL = Math.max(2, panel.clientWidth - w - 2);
        const maxT = Math.max(2, panel.clientHeight - h - 2);
        if (petEl.style.left !== '') {
            petEl.style.left = Math.min(Math.max(parseFloat(petEl.style.left) || 0, 2), maxL) + 'px';
        }
        if (petEl.style.top !== '') {
            petEl.style.top = Math.min(Math.max(parseFloat(petEl.style.top) || 0, 2), maxT) + 'px';
        }
        petBubbleSide();
    }
    function petSavePos() {
        try {
            localStorage.setItem(PET_POS_KEY, JSON.stringify({
                left: petEl.style.left, top: petEl.style.top
            }));
        } catch (e) { /* 隐私模式等场景忽略 */ }
    }
    function petRestorePos() {
        let v = null;
        try { v = JSON.parse(localStorage.getItem(PET_POS_KEY) || 'null'); } catch (e) { v = null; }
        if (v && v.left && v.top) {
            petEl.style.left = v.left;
            petEl.style.top = v.top;
            petEl.style.right = 'auto';
            petEl.style.bottom = 'auto';
            petClamp();
        }
    }

    function petBindDrag() {
        let active = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;

        petEl.addEventListener('pointerdown', function (e) {
            if (e.button !== 0) return;
            const panel = petEl.offsetParent;
            if (!panel) return;
            active = true; moved = false;
            sx = e.clientX; sy = e.clientY;
            ox = petEl.offsetLeft; oy = petEl.offsetTop;
            petEl.style.left = ox + 'px';
            petEl.style.top = oy + 'px';
            petEl.style.right = 'auto';
            petEl.style.bottom = 'auto';
            try { petEl.setPointerCapture(e.pointerId); } catch (err) {}
        });

        petEl.addEventListener('pointermove', function (e) {
            if (!active) return;
            const dx = e.clientX - sx, dy = e.clientY - sy;
            if (!moved) {
                if (Math.abs(dx) + Math.abs(dy) < 5) return;   // 抖动阈值内算点击
                moved = true;
                petDragging = true;
                petEl.classList.add('dragging');
            }
            const panel = petEl.offsetParent;
            const maxL = Math.max(2, panel.clientWidth - petEl.offsetWidth - 2);
            const maxT = Math.max(2, panel.clientHeight - petEl.offsetHeight - 2);
            petEl.style.left = Math.min(Math.max(ox + dx, 2), maxL) + 'px';
            petEl.style.top = Math.min(Math.max(oy + dy, 2), maxT) + 'px';
            petBubbleSide();
        });

        function petEnd(e) {
            if (!active) return;
            active = false;
            petEl.classList.remove('dragging');
            try { petEl.releasePointerCapture(e.pointerId); } catch (err) {}
            if (moved) {
                petDragging = false;
                petSavePos();
            }
        }
        petEl.addEventListener('pointerup', petEnd);
        petEl.addEventListener('pointercancel', petEnd);

        // 单击延迟 200ms：区分「点一下互动」和「双击填提示词」
        petEl.addEventListener('click', function () {
            if (moved) return;
            clearTimeout(petClickTimer);
            petClickTimer = setTimeout(petOnClick, 200);
        });
        petEl.addEventListener('dblclick', function () {
            if (moved) return;
            clearTimeout(petClickTimer);
            petOnDblClick();
        });
        petEl.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); petOnClick(); }
        });
        window.addEventListener('resize', petClamp);
    }

    // ---- 随机待机小动作 ----
    function petIdleTick() {
        if (!petRefs() || petDragging) return;
        if (petState === 'idle') {
            const r = Math.random();
            if (r < 0.30) { petBlink(); return; }
            if (r < 0.44) { petShow(petPick(PET_LINES.idle), 2400); return; }
            const a = petPick(PET_IDLE_ACTS);
            petFlash(a[0], a[1]);
        } else if (Math.random() < 0.5) {
            petBlink();
        }
    }
    function petScheduleIdle() {
        clearTimeout(petIdleTimer);
        petIdleTimer = setTimeout(function () { petIdleTick(); petScheduleIdle(); }, 2400 + Math.random() * 5200);
    }

    function petInit() {
        if (!petRefs()) return;      // 标记不在页面里就整块放弃，保持纯装饰
        petEl.dataset.state = petState;
        petRestorePos();
        petBindDrag();
        petScheduleIdle();
        petBubbleSide();
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', petInit);
    } else {
        petInit();
    }

    // ---- 粗粒度兜底：万一某个事件没覆盖到，至少保证「忙→空闲」能回来 ----
    // 只用业务层的 setStatus（发消息置忙 / complete、error 收尾），不用 onerror/onclose。
    (function hookPetStatus() {
        if (typeof setStatus !== 'function') return;
        const _origSetStatus = setStatus;
        setStatus = function (busy) {
            _origSetStatus.apply(this, arguments);
            try {
                if (busy) { if (petState === 'idle') petSetState('think'); }
                else { petAlert(false); petSetState('idle'); }
            } catch (e) { /* 桌宠出错绝不影响主流程 */ }
        };
    })();
</script>
</body>
</html>
